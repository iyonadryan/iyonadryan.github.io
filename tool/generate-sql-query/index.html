<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generate SQL Query — Iyon Tool</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💾</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <a class="back-link" href="../index.html" aria-label="Kembali ke Iyon Tool">←</a>
  <h1>Generate SQL Query</h1>
  <span class="tagline">bikin data dummy + query siap eksekusi</span>
  <button class="theme-toggle" id="themeToggle" aria-label="Ganti tema">🌙</button>
</div>

<div class="layout">

  <!-- LEFT: builder -->
  <div class="panel builder">
    <h2>Tabel &amp; Mode</h2>
    <div class="field-row">
      <label for="tableName">Nama Tabel</label>
      <input type="text" id="tableName" value="users" placeholder="nama_tabel" spellcheck="false" autocomplete="off">
    </div>
    <div class="mode-tabs" id="modeTabs">
      <button type="button" class="mode-tab active" data-mode="mysql">MySQL</button>
      <button type="button" class="mode-tab" data-mode="postgresql">PostgreSQL</button>
    </div>

    <h2 style="margin-top:20px;">Kolom</h2>
    <div class="column-list" id="columnList"></div>
    <button type="button" class="tool-btn tool-btn-block" id="addColumnBtn">+ Tambah Kolom</button>

    <h2 style="margin-top:20px;">Generate</h2>
    <div class="field-row">
      <label for="rowCount">Jumlah Baris (row)</label>
      <input type="number" id="rowCount" min="1" max="5000" value="100">
    </div>
    <label class="checkbox-row">
      <input type="checkbox" id="includeCreateTable" checked>
      Sertakan <code>CREATE TABLE</code>
    </label>
    <button type="button" class="btn-grad" id="generateBtn">⚡ Generate Query</button>
  </div>

  <!-- RIGHT: output -->
  <div class="panel output" id="outputPanel" hidden>
    <div class="output-head">
      <h2>Query SQL</h2>
      <button type="button" class="copy-btn" id="copyBtn">📋 Salin</button>
    </div>
    <pre class="sql-box" id="sqlOutput"></pre>

    <div class="output-head" style="margin-top:22px;">
      <h2>Preview Hasil Eksekusi</h2>
      <span class="preview-note" id="previewNote"></span>
    </div>
    <div class="table-scroll">
      <table id="previewTable"></table>
    </div>
  </div>

  <div class="panel output-empty" id="emptyPanel">
    <p>👈 Atur kolom &amp; jumlah baris, lalu klik <strong>Generate Query</strong> utk melihat hasilnya di sini.</p>
  </div>

</div>

<div class="toast" id="toast"></div>

<script src="script.js"></script>
</body>
</html>
