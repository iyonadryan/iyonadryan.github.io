<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generate Color — Iyon Tool</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎨</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <a class="back-link" href="../index.html" aria-label="Kembali ke Iyon Tool">←</a>
  <h1>Generate Color</h1>
  <span class="tagline">skema warna &amp; katalog</span>
  <button class="theme-toggle" id="themeToggle" aria-label="Ganti tema">🌙</button>
</div>

<div class="layout">

  <div class="panel">
    <h2>Warna Dasar</h2>
    <div class="base-color-row">
      <input type="color" id="baseColorPicker" value="#0F6E63" autocomplete="off">
      <input type="text" id="baseColorHex" class="hex-input" value="#0F6E63" maxlength="7" spellcheck="false" autocomplete="off">
      <button type="button" class="btn-ghost" id="randomColorBtn">Acak</button>
      <button type="button" class="btn-ghost" id="saveColorBtn">Simpan</button>
    </div>
    <div class="rgb-row">
      <label class="rgb-field"><span class="rgb-label">R</span><input type="number" id="baseColorR" min="0" max="255" step="1" inputmode="numeric" value="15" autocomplete="off"></label>
      <label class="rgb-field"><span class="rgb-label">G</span><input type="number" id="baseColorG" min="0" max="255" step="1" inputmode="numeric" value="110" autocomplete="off"></label>
      <label class="rgb-field"><span class="rgb-label">B</span><input type="number" id="baseColorB" min="0" max="255" step="1" inputmode="numeric" value="99" autocomplete="off"></label>
    </div>
    <div class="saved-colors" id="savedColors"></div>
  </div>

  <div class="panel">
    <h2>Skema Warna</h2>
    <div class="scheme-tabs" id="schemeTabs">
      <button type="button" class="scheme-tab active" data-scheme="complementary">Komplementer</button>
      <button type="button" class="scheme-tab" data-scheme="analogous">Analogus</button>
      <button type="button" class="scheme-tab" data-scheme="triadic">Triadik</button>
      <button type="button" class="scheme-tab" data-scheme="tetradic">Tetradik</button>
      <button type="button" class="scheme-tab" data-scheme="splitComplementary">Split-Komplementer</button>
      <button type="button" class="scheme-tab" data-scheme="monochromatic">Monokromatik</button>
      <button type="button" class="scheme-tab" data-scheme="uiPalette">Palet UI (5 Warna)</button>
    </div>
    <p class="scheme-desc" id="schemeDesc"></p>
    <div class="scheme-grid" id="schemeGrid"></div>
    <p class="contrast-note" id="contrastNote" hidden></p>
  </div>

  <div class="panel">
    <h2>Katalog Warna</h2>
    <p class="catalog-hint">Klik salah satu warna untuk menyalin kode HEX-nya dan menjadikannya warna dasar di atas.</p>
    <div class="catalog" id="catalog"></div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script src="script.js"></script>
</body>
</html>
