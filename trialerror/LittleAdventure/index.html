<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Little Adventure</title>
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
  // Project Firebase SAMA PERSIS dgn tilemap.html (config disalin apa
  // adanya) — dipakai buat baca map yg disimpan dari Tilemap Editor
  // (lihat "Dunia dari Tilemap Editor" di CLAUDE.md).
  const firebaseConfig = {
    apiKey: "AIzaSyAzjLIkaqXKZ4L1xJe7U-vx8t1ITkNGt08",
    authDomain: "iyon-adryanlf-trialerror.firebaseapp.com",
    databaseURL: "https://iyon-adryanlf-trialerror.firebaseio.com",
    projectId: "iyon-adryanlf-trialerror",
    storageBucket: "iyon-adryanlf-trialerror.firebasestorage.app",
    messagingSenderId: "519669963248",
    appId: "1:519669963248:web:feab50008d27c2a7226535",
    measurementId: "G-4MFLB4B68F"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
</script>
</head>
<body>
  <!-- Dipisah dari #gameWorld & diposisikan absolute (nempel di atas layar)
       supaya TIDAK ikut dihitung flexbox body saat nge-center #gameWorld —
       jadi kotak game selalu pas di tengah layar, apa pun tinggi header ini. -->
  <div class="game-header">
    <h1>Little Adventure</h1>
    <div class="header-actions">
      <button type="button" id="changeCharacterBtn" class="change-character-btn">🧑 Karakter</button>
      <button type="button" id="openMapPickerBtn" class="change-character-btn">🗺️ Map</button>
      <a href="tilemap.html" id="editorLink" class="tilemap-link">🚧 Editor</a>
      <!-- Khusus PC/laptop (permintaan eksplisit user) — disembunyikan di HP
           lewat @media (pointer: coarse) di style.css, pola yg sama dgn
           touch-joystick/touch-actions tapi kebalik (nongol di mouse,
           sembunyi di sentuh). Ditaruh SETELAH Editor (permintaan eksplisit
           user "disamping kanan editor, bukan kiri") — urutan DOM = urutan
           tampil krn `.header-actions` flex row biasa tanpa `order`. -->
      <button type="button" id="musicBtn" class="music-btn">▶︎ Music</button>
    </div>
  </div>

  <!-- #chatInputBar ditaruh di sini (bukan di .game-header) & diposisikan
       absolute nempel di BAWAH #gameWorld — permanen kelihatan (tidak lagi
       toggle show/hide via Enter, lihat "Ngomong" di CLAUDE.md), jadi tidak
       pernah menggeser posisi kotak game apa pun kondisinya. -->
  <div class="game-stage">
    <!-- Nama map yg lagi dipilih (permintaan eksplisit user) — diisi/di-
         update JS (lihat loadAndSetupWorld() di script.js) tiap kali dunia
         dimuat/diganti lewat popup "Pilih Map". -->
    <div class="map-label-wrap">Map : <span id="mapLabelName"></span></div>
    <div id="gameWorld">
      <div id="worldLayer">
        <div class="character" id="character">
          <div class="speech-bubble" id="speechBubble"></div>
        </div>
      </div>
    </div>
    <div class="chat-input-bar" id="chatInputBar">
      <input type="text" id="chatInput" class="chat-input" placeholder="Ketik pesan, lalu tekan Enter atau →...">
      <button type="button" id="sendChatBtn" class="chat-send-btn" title="Kirim">→</button>
    </div>
  </div>

  <!-- ===================== KONTROL LAYAR SENTUH (HP) =====================
       Cuma kelihatan di device layar sentuh (`@media (pointer: coarse)`,
       lihat style.css) — di desktop/mouse tetap pakai keyboard spt biasa.
       Kontrol arah pakai analog stick (permintaan eksplisit user, gantiin
       4 tombol W/A/S/D persegi versi awal) — seret knob di dalam lingkaran
       dasar, arah ditentukan dari sudut seretannya, tetap manggil fungsi JS
       yg SAMA persis dgn keyboard (addDirection/removeDirection), lihat
       "Kontrol layar sentuh" di CLAUDE.md. -->
  <div class="touch-joystick" id="touchJoystick">
    <div class="joystick-knob" id="joystickKnob"></div>
  </div>
  <div class="touch-actions" id="touchActions">
    <button type="button" class="action-btn" id="touchShiftBtn" title="Jalan pelan">🚶</button>
    <button type="button" class="action-btn" id="touchJumpBtn" title="Lompat">⤴️</button>
  </div>

  <!-- ===================== OVERLAY: PILIH KARAKTER ===================== -->
  <div class="picker-overlay" id="characterPickerOverlay">
    <div class="picker-sheet">
      <div class="picker-header">
        <h2>Pilih Karakter</h2>
        <button type="button" class="picker-close-btn" id="closePickerBtn">✕</button>
      </div>
      <div class="gender-tabs" id="genderTabs">
        <button type="button" class="gender-tab active" data-gender="Male">Pria</button>
        <button type="button" class="gender-tab" data-gender="Female">Wanita</button>
      </div>
      <div class="character-grid" id="characterGrid"></div>
    </div>
  </div>

  <!-- ===================== OVERLAY: PILIH MAP (Firebase) =====================
       Daftar SEMUA map tersimpan di trial-error/littleAdventure/tilemaps,
       diambil pakai REST ?shallow=true (cuma nama/key, BUKAN isi tiles-nya
       yg berat) — cocok skalanya sampai ~1000 map, lihat "Pilih Map" di
       CLAUDE.md. -->
  <div class="picker-overlay" id="mapPickerOverlay">
    <div class="picker-sheet">
      <div class="picker-header">
        <h2>Pilih Map</h2>
        <button type="button" class="picker-close-btn" id="closeMapPickerBtn">✕</button>
      </div>
      <input type="text" id="mapSearchInput" class="map-search-input" placeholder="Cari nama map...">
      <div class="map-list" id="mapList"></div>
    </div>
  </div>

  <!-- ===================== OVERLAY: PERINGATAN EDITOR DI HP =====================
       Cuma dipicu di device layar sentuh (`pointer: coarse`, dicek scr JS
       saat klik #editorLink) — Tilemap Editor tidak dirancang responsif
       utk layar kecil, jadi user ditawari batal dulu sblm lanjut buka di
       HP. Lihat "Peringatan buka Editor di HP" di CLAUDE.md. -->
  <div class="picker-overlay" id="editorWarningOverlay">
    <div class="picker-sheet">
      <div class="picker-header">
        <h2>⚠️ Rekomendasi</h2>
      </div>
      <p class="editor-warning-text">Halaman ini direkomendasikan dibuka menggunakan PC/laptop. Tetap ingin membuka halaman ini tanpa PC/laptop?</p>
      <div class="editor-warning-actions">
        <button type="button" id="editorWarningBackBtn" class="editor-warning-back-btn">Kembali</button>
        <button type="button" id="editorWarningContinueBtn" class="editor-warning-continue-btn">Lanjut</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
