<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Little Adventure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Dipisah dari #gameWorld & diposisikan absolute (nempel di atas layar)
       supaya TIDAK ikut dihitung flexbox body saat nge-center #gameWorld —
       jadi kotak game selalu pas di tengah layar, apa pun tinggi header ini. -->
  <div class="game-header">
    <h1>Little Adventure</h1>
    <div class="hint">
      <p>— Gerakkan karakter pakai ↑ ← ↓ → atau W A S D</p>
      <p>— Tekan Shift untuk jalan pelan</p>
      <p>— Tekan Space untuk melompat</p>
      <p>— Tekan Enter untuk ngomong</p>
    </div>
    <button type="button" id="changeCharacterBtn" class="change-character-btn">🧑 Ganti Karakter</button>
  </div>

  <!-- #chatInput ditaruh di sini (bukan di .game-header) & diposisikan
       absolute nempel di BAWAH #gameWorld — biar muncul/hilangnya tidak
       menggeser posisi kotak game (lihat "Layout" di CLAUDE.md). -->
  <div class="game-stage">
    <div id="gameWorld">
      <div id="worldLayer">
        <div class="character" id="character">
          <div class="speech-bubble" id="speechBubble"></div>
        </div>
      </div>
    </div>
    <input type="text" id="chatInput" class="chat-input" placeholder="Ketik pesan, lalu tekan Enter..." hidden>
  </div>

  <!-- ===================== OVERLAY: PILIH KARAKTER ===================== -->
  <div class="character-picker-overlay" id="characterPickerOverlay">
    <div class="character-picker-sheet">
      <div class="picker-header">
        <h2>Pilih Karakter</h2>
        <button type="button" class="picker-close-btn" id="closePickerBtn">✕</button>
      </div>
      <div class="gender-tabs" id="genderTabs">
        <button type="button" class="gender-tab active" data-gender="Male">Pria</button>
        <button type="button" class="gender-tab" data-gender="Female">Wanita</button>
      </div>
      <div class="character-grid" id="characterGrid"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
